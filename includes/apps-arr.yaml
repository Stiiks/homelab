networks:
  proxy-network:
    external: true

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${PATH_SYSTEM_CONFIG}/prowlarr:/config
    networks:
      - proxy-network
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${PATH_SYSTEM_CONFIG}/radarr:/config
      - ${PATH_MEDIA_STORAGE}:/data
    networks:
      - proxy-network
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${PATH_SYSTEM_CONFIG}/sonarr:/config
      - ${PATH_MEDIA_STORAGE}:/data
    networks:
      - proxy-network
    restart: unless-stopped