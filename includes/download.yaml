networks:
  proxy-network:
    external: true

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${PATH_SYSTEM_CONFIG}/qbittorrent:/config
      - ${PATH_MEDIA_STORAGE}/downloads:/downloads
    ports:
      - 127.0.0.1:8080:8080
      - 6881:6881
      - 6881:6881/udp
    networks:
      - proxy-network
    restart: unless-stopped